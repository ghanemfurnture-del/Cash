name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 - TypeScript Typecheck
        run: npm run typecheck

      - name: Gate 2 - Automated Unit & Integration Tests
        run: npm test

      - name: Gate 3 - Production Build & PWA Generation
        run: npm run build

      - name: Gate 4 - Secret Leak Scanner
        run: npm run scan:secrets
